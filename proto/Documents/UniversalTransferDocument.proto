syntax="proto3";
import "Documents/ReceiptStatus.proto";

package Diadoc.Proto.Documents.UniversalTransferDocument;

message UniversalTransferDocumentMetadata {
	UniversalTransferDocumentStatus DocumentStatus = 1;
	string Total = 2; // TotalSum;
	string Vat = 3; //TotalVat;
	string Grounds = 4; // DocumentGrounds
	string DocumentFunction = 5;
	int32 Currency = 6;
	ReceiptStatus ReceiptStatus = 7;
	sfixed64 ConfirmationDateTimeTicks = 8;
	int32 InvoiceAmendmentFlags = 9;
}

message UniversalTransferDocumentRevisionMetadata {
	UniversalTransferDocumentStatus DocumentStatus = 1;
	string Total = 2; // TotalSum;
	string Vat = 3; //TotalVat;
	string Grounds = 4; // DocumentGrounds
	string DocumentFunction = 5;
	int32 Currency = 6;
	sfixed64 ConfirmationDateTimeTicks = 7;
	int32 InvoiceAmendmentFlags = 8;
	string OriginalInvoiceNumber = 9;
	string OriginalInvoiceDate = 10;
}

message UniversalCorrectionDocumentMetadata {
	UniversalTransferDocumentStatus DocumentStatus = 1;
	string TotalInc = 2;
	string TotalDec = 3;
	string VatInc = 4;
	string VatDec = 5;
	string Grounds = 6; // DocumentGrounds
	string DocumentFunction = 7;
	int32 Currency = 8;
	sfixed64 ConfirmationDateTimeTicks = 9;
	int32 InvoiceAmendmentFlags = 10;
	string OriginalInvoiceNumber = 11;
	string OriginalInvoiceDate = 12;
	string OriginalInvoiceRevisionNumber = 13;
	string OriginalInvoiceRevisionDate = 14;
}

message UniversalCorrectionDocumentRevisionMetadata {
	UniversalTransferDocumentStatus DocumentStatus = 1;
	string TotalInc = 2;
	string TotalDec = 3;
	string VatInc = 4;
	string VatDec = 5;
	string Grounds = 6; // DocumentGrounds
	string DocumentFunction = 7;
	int32 Currency = 8;
	sfixed64 ConfirmationDateTimeTicks = 9;
	int32 InvoiceAmendmentFlags = 10;
	string OriginalInvoiceNumber = 11;
	string OriginalInvoiceDate = 12;
	string OriginalInvoiceRevisionNumber = 13;
	string OriginalInvoiceRevisionDate = 14;
	string OriginalInvoiceCorrectionNumber = 15;
	string OriginalInvoiceCorrectionDate = 16;
}

enum UniversalTransferDocumentStatus {
	UnknownDocumentStatus = 0;	// This type will be reported to legacy client when it receives unknown status from server
	OutboundWaitingForSenderSignature = 1;
	OutboundWaitingForInvoiceReceiptAndRecipientSignature = 2;
	OutboundWaitingForInvoiceReceipt = 3;
	OutboundWaitingForRecipientSignature = 4;
	OutboundInvalidSenderSignature = 5;
	InboundWaitingForInvoiceReceiptAndRecipientSignature = 6;
	InboundWaitingForRecipientSignature = 7;
	InboundWaitingForInvoiceReceipt = 8;
	InboundWithRecipientSignature = 9;
	InboundInvalidRecipientSignature = 10;
}
