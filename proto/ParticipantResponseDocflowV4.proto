syntax="proto3";

import "ConfirmationDocflowV4.proto";
import "Documents/RecipientResponseStatus.proto";
import "SignatureRejectionDocflowV4.proto";
import "SignatureV3.proto";
import "SignedAttachmentV3.proto";
import "Timestamp.proto";

package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/ParticipantResponseDocflowV4.html
// Состояние ответного действия участника документооборота документа.

message ParticipantResponseDocflowV4
{
    // флаг, указывающий, что текущий документооборот завершен. От участника документооборота не требуются дополнительные действия.
    bool IsFinished = 1;
    // данные электронной подписи, представленные структурой SignatureV3.
    SignatureV3 Signature = 2;
    // информация о файле титула и подписи под ним, представленная структурой SignedAttachmentV3.
    SignedAttachmentV3 Title = 3;
    // информация об отказе в подписи, представленная структурой SignatureRejectionDocflowV4.
    SignatureRejectionDocflowV4 Rejection = 4;
    // время отправки ответа, представленное структурой Timestamp.
    Timestamp SentAt = 5;
    // время доставки ответа в ящик отправителя, представленное структурой Timestamp.
    Timestamp DeliveredAt = 6;
    // статус ответа, принимает значения из перечисления RecipientResponseStatus.
    Documents.RecipientResponseStatus ResponseStatus = 7;
    // информация о состоянии подтверждения даты доставки, представленная структурой ConfirmationDocflow. Подтверждение может возвращаться на титул покупателя или отказ в подписи.
    ConfirmationDocflowV4 Confirmation = 8;
}




