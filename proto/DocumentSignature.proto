syntax="proto3";

import "PowerOfAttorneyToPost.proto";

package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/DocumentSignature.html
// Данные электронной подписи (ЭП) к документам в отправляемом дополнении к сообщению.

message DocumentSignature {
    // идентификатор подписываемых данных в отправляемом сообщении. Должен соответствовать содержимому поля Entity.EntityId какой-либо сущности в отправляемом сообщении Message. Набор сущностей в сообщении и их идентификаторы можно получить либо из ответа метода PostMessage (V3) при создании сообщения, либо с помощью метода GetMessage (V6).
    string ParentEntityId = 1;
    // электронная подпись в формате CMS SignedData в DER-кодировке. Может отсутствовать в черновике или при отложенной отправке.
    bytes Signature = 2;
    // признак того, что документ должен быть подписан тестовой подписью.
    bool SignWithTestSignature = 4 ;
    // признак того, что подпись является согласующей.
    bool IsApprovementSignature = 5 ;
    // имя подписи на полке документов.
    string SignatureNameOnShelf = 6;
    // идентификатор содержимого документа, подготовленного к подписанию. Должен быть получен методом PrepareDocumentsToSign в поле `PatchedContentId` структуры PrepareDocumentsToSignResponse.
    string PatchedContentId = 7;
    // список меток.
    repeated string Labels = 8;
    // данные машиночитаемой доверенности, представленные структурой PowerOfAttorneyToPost.
    PowerOfAttorneyToPost PowerOfAttorney = 9;
}




