syntax="proto3";
package Diadoc.Proto.Events;

// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/ResolutionInfo.html

message ResolutionInfo {
	ResolutionType ResolutionType = 1;
	string Author = 2;	// ФИО согласователя
	string InitialRequestId = 3;
}

enum ResolutionType {
	UndefinedResolutionType = 0;
	Approve = 1;
	Disapprove = 2;
	UnknownResolutionType = 3;
}
