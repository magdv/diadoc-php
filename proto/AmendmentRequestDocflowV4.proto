syntax="proto3";

import "ConfirmationDocflowV4.proto";
import "SignedAttachmentV3.proto";
import "Timestamp.proto";
import "UniversalMessageAttachmentDocflow.proto";

package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/AmendmentRequestDocflowV4.html
// Состояние уведомления об уточнении (УоУ).

message AmendmentRequestDocflowV4
{
    // флаг указывающий, что документооборот по УоУ завершен и не требует дальнейших действий.
    bool IsFinished = 1;
    // информация о файле УоУ и подписи под ним, представленная структурой SignedAttachmentV3.
    SignedAttachmentV3 AmendmentRequest = 2;
    // время отправки УоУ, представленная структурой Timestamp.
    Timestamp SentAt = 3;
    // время доставки УоУ в ящик отправителя документа, представленная структурой Timestamp.
    Timestamp DeliveredAt = 4;
    // информация об извещении о получении УоУ отправителем документа, представленная структурой ReceiptDocflowV4.
    ReceiptDocflowV4 Receipt = 5;
    // статус УоУ или исправления/корректировки, принимает значения из перечисления InvoiceAmendmentFlags.
    int32 AmendmentFlags = 6;
    // текст уведомления об уточнении.
    string PlainText = 7;
    // информация о подтверждении оператором даты получения или доставки УОУ, представленная структурой ConfirmationDocflowV4.
    ConfirmationDocflowV4 ConfirmationDocflow = 8;
    // универсальное сообщение с уведомлением об уточнении, представленное структурой UniversalMessageAttachmentDocflow.
    UniversalMessageAttachmentDocflow UniversalMessage = 9;
}




