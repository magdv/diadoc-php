syntax="proto3";
package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/ManualBlockStatus.html
// Статус ручной блокировки ящика на отправку документов.

message ManualBlockStatus
{
    // признак того, что отправка заблокирована.
    bool IsBlocked = 1;
    // дата создания задания на блокировку, отправка документов будет заблокирована через 3 дня после создания задания.
    sfixed64 RequestedTicks = 2;
}




