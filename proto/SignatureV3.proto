syntax="proto3";

import "Entity.proto";
import "PowerOfAttorneyAttachmentStatus.proto";
import "SignaturePowerOfAttorney.proto";
import "SignatureTypeInfo.proto";
import "SignatureVerificationResult.proto";
import "Timestamp.proto";

package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/SignatureV3.html
// Данные электронной подписи под документом.

message SignatureV3 {
    // информация о содержимом оригинальной подписи, представленная структурой Entity.
    Entity Cms = 1;
    // информация о содержимом подписи в формате CADES-T, представленная структурой Entity.
    Entity CadesT = 2;
    // идентификатор ящика, от имени которого была поставлена подпись.
    string SignerBoxId = 3;
    // идентификатор подразделения, сотрудник которого поставил подпись.
    string SignerDepartmentId = 4;
    // признак того, что подпись проверена и признана верной или еще не прошла проверку.
    bool IsValid = 5;
    // результат проверки подписи, представленный структурой SignatureVerificationResult. Возвращается в ответе методов, если в запросе был установлен признак `InjectEntityContent` `=` `true`.
    SignatureVerificationResult VerificationResult = 6;
    // время доставки подписи, представленная структурой Timestamp.
    Timestamp DeliveredAt = 7;
    // информация о машиночитаемой доверенности и ее статусе, представленная структурой SignaturePowerOfAttorney.
    SignaturePowerOfAttorney PowerOfAttorney = 8;
    // статус приложенности машиночитаемой доверенности к подписи, представленный структурой PowerOfAttorneyAttachmentStatus.
    Docflow.PowerOfAttorneyAttachmentStatus PowerOfAttorneyAttachmentStatus = 9;
    // информация о типе подписи, представленная структурой SignatureTypeInfo. Возвращается только для документов, подписанных после 05.06.2025 12:00 (UTC).
    SignatureTypeInfo SignatureTypeInfo = 10;
}




