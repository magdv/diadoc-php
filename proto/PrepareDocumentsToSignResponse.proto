syntax="proto3";

import "DocumentId.proto";

package Diadoc.Proto;


// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/PrepareDocumentsToSignResponse.html
// Результат подготовки документов к подписанию методом PrepareDocumentsToSign.

message PrepareDocumentsToSignResponse {
    // список документов, подготовленных к подписанию и отправке. Каждый элемент списка представлен структурой `DocumentPatchedContent` с полями:
    repeated DocumentPatchedContent DocumentPatchedContents = 1;
}

message DocumentPatchedContent {
    // идентификатор документа, подготовленного к подписанию и отправке, представленный структурой DocumentId.
    DocumentId DocumentId = 1;
    // идентификатор содержимого документа, подготовленного к подписанию и отправке. Его можно использовать при отправке документа в поле `PatchedContentId` в структурах DocumentSignature и DocumentSenderSignature.
    string PatchedContentId = 2;
    // подготовленное к подписанию содержимое документа. Подпись под документом нужно формировать для этого содержимого.
    bytes Content = 3;
}




