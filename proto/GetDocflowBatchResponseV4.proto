syntax="proto3";

import "DocumentWithDocflowV4.proto";

package Diadoc.Proto;

// Diadoc API proto docs: https://developer.kontur.ru/Docs/diadoc-api/proto/GetDocflowBatchResponseV4.html
// Cписок документов с информацией о документообороте, полученный методом GetDocflows (V4).

message GetDocflowBatchResponseV4
{
    // список документов с информацией о документообороте, представленных структурой DocumentWithDocflowV4.
    repeated DocumentWithDocflowV4 Documents = 1;
}




